# AIDA + Tailscale: HTTPS privato su https://aida.<tuo-tailnet>.ts.net, raggiungibile da tutti i tuoi dispositivi.
# Avvio:  cp .env.example .env  (compila TS_AUTHKEY)  →  docker compose -f docker-compose.tailscale.yml up -d --build
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: aida-tailscale
    hostname: ${TS_HOSTNAME:-aida}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    volumes:
      - ts-state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped
  aida:
    build: .
    container_name: aida
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - .env
    volumes:
      - aida-data:/data
    restart: unless-stopped
volumes:
  ts-state:
  aida-data:
